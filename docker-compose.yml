services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusbite}
      POSTGRES_DB: ${POSTGRES_DB:-campusbite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env   # secrets stay outside the image and the repo
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-campusbite}:${POSTGRES_PASSWORD:-campusbite}@db:5432/${POSTGRES_DB:-campusbite}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
